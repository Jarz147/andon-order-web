<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andon Order — Ambil Orderan & Matikan Andon</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-view" class="login-wrap hidden">
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-logo">⛑</div>
            <h1>ANDON ORDER</h1>
            <p>Login untuk mengambil orderan &amp; mematikan andon</p>
        </div>
        <form id="auth-form">
            <label>Email</label>
            <input id="a-email" type="email" autocomplete="email" required>
            <label>Password</label>
            <input id="a-pass" type="password" autocomplete="current-password" required>
            <p id="auth-err" class="err hidden"></p>
            <button type="submit" id="auth-submit">Masuk</button>
        </form>
        <button id="auth-toggle" class="btn-ghost auth-toggle">Belum punya akun? Daftar</button>
    </div>
</div>

<!-- ===================== DASHBOARD ===================== -->
<div id="main-view" class="hidden">
    <header class="header">
        <div class="header-left">
            <span class="title">ANDON ORDER</span>
            <span id="conn" class="badge badge-off">KONEKSI…</span>
        </div>
        <div class="header-right">
            <span id="clock" class="clock"></span>
            <span id="user-chip" class="chip"></span>
            <span id="user-role" class="chip chip-role"></span>
            <button id="btn-logout" class="btn-ghost">Keluar</button>
        </div>
    </header>

    <section class="stats">
        <div class="stat"><span class="stat-num" id="stat-active">0</span><span class="stat-label">Andon Aktif</span></div>
        <div class="stat"><span class="stat-num" id="stat-total">0</span><span class="stat-label">Total Jalur</span></div>
        <div class="stat"><span class="stat-num" id="stat-my">0</span><span class="stat-label">Order Diambil Saya</span></div>
    </section>

    <main>
        <h2 class="section-title">Orderan Masuk</h2>
        <div id="lines-grid" class="grid"></div>

        <h2 class="section-title">Riwayat Order Saya</h2>
        <div id="order-log" class="log"><div class="log-empty">Memuat…</div></div>
    </main>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
